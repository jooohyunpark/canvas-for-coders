allowBuilds:
  es5-ext: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5

# Security floors for transitive deps that resolve below a patched version.
# Keep the upper bound: an unbounded ">=x" target lets pnpm jump a major.
overrides:
  postcss@<8.5.23: "^8.5.23" # GHSA-6g55-p6wh-862q and follow-ups
  sharp@<0.35.0: "^0.35.0" # inherited libvips advisories
